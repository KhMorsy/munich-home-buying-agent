[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "munich-home-buying-agent"
version = "0.1.0"
description = "LangChain Deep Agents Munich home-buying assistant (hackathon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.7.0",
  "langchain>=1.4.0",
  "langchain-openai>=1.0.0",
  "langchain-anthropic>=1.0.0",
  "langgraph>=1.0.0",
  "langgraph-checkpoint>=2.0.0",
  "langgraph-sdk>=0.2.0",
  "langsmith>=0.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "tavily-python>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "langgraph-cli[inmem]>=0.4.0",
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["skills/**/*.md"]
